<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jacques+Francois&display=swap" rel="stylesheet">
<script src="senha.js" defer></script>
    <title>Document</title>
</head>
<body>
<img src="assets/6d645797265c2f039a6458ec63ef855aa28b09b8.jpg" alt="Music Hall" class="fundo">
<div class="container">
    <div class="logo">
        <img src="assets/Mask group.png" alt="Senac">
        <h1>Music Hall</h1>
    </div>
    <form action="" class="formulario">
        <div class="grupo-input">
            <label for="email">E-mail:</label>
            <input type="email"  id="email" placeholder="Digite seu e-mail ou CPF.">
        </div>
        <div class="grupo-input">
            <label for="senha">Senha</label>
            <div class="input-senha">
                <input type="password" id="senha" required minlength="8" placeholder="Digite sua Senha.">
                <button type="button" class="olho" onclick="mostrar_senha()">
                    <img src="assets/Vector.png" alt="">
                </button>
                <a href="#">Esqueceu sua senha?</a>
            </div>
        </div>
        <div class="btn-grupo">
            <button type="submit">Entrar</button>
            <button type="button">Cadastrar</button>
        </div>
    </form>
</div>
</body>
</html>
